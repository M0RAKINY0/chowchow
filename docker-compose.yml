services:
  redis:
    image: redis:7-alpine
    container_name: chowchow-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - chowchow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chowchow-redis-data:
